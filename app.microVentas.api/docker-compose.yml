services:

  postgres:
    image: postgres:16
    container_name: database-postgres-ventas
    environment:
      POSTGRES_DB: MicroVentasDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - postgres-ventas-data:/var/lib/postgresql/data
    networks:
      - microventas-net

  microventas:
    image: microventas-api:1.0
    container_name: microventas-api
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/MicroVentasDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8082:8080"
    networks:
      - microventas-net

volumes:
  postgres-ventas-data:

networks:
  microventas-net:
    driver: bridge