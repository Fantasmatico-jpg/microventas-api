# ==========================================
# MICROVENTAS API
# ==========================================

spring.application.name=microventas-api

server.port=8082


# ==========================================
# BASE DE DATOS POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://database-postgres-ventas:5432/MicroVentasDB
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# RABBITMQ
# ==========================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework=INFO
logging.level.com.example.microventas=DEBUG
