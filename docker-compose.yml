services:

  # =====================================================
  # PostgreSQL - MicroVentas
  # =====================================================
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: MicroVentasDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - postgres-ventas-data:/var/lib/postgresql/data
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d MicroVentasDB"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =====================================================
  # MySQL - MicroProductos
  # =====================================================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: MicroProductosDB
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql-productos-data:/var/lib/mysql
    networks:
      - microservicios-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uadmin",
          "-padmin"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =====================================================
  # SQL Server - MicroClientes
  # =====================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "adminAppDist2025#"
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sql-clientes-data:/var/opt/mssql
    networks:
      - microservicios-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'adminAppDist2025#' -C -Q 'SELECT 1' > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # =====================================================
  # RabbitMQ - Broker
  # =====================================================
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservicios-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =====================================================
  # MicroVentas - Publisher
  # =====================================================
  microventas:
    build:
      context: ./app.microVentas.api
      dockerfile: Dockerfile
    image: microventas-api:2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/MicroVentasDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    ports:
      - "8082:8080"
    networks:
      - microservicios-net

  # =====================================================
  # MicroProductos - Consumer
  # =====================================================
  microproductos:
    build:
      context: ./microproductos-api
      dockerfile: Dockerfile
    image: microproductos-api:2.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql+pymysql://admin:admin@mysql:3306/MicroProductosDB"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
    ports:
      - "8002:8000"
    networks:
      - microservicios-net

  # =====================================================
  # MicroClientes - Consumer
  # =====================================================
  microclientes:
    build:
      context: ./app.microCliente.api
      dockerfile: Dockerfile
    image: microclientes-api:2.0
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__BDDSqlServer: "Server=sqlserver,1433;Database=microCliente;User Id=sa;Password=adminAppDist2025#;TrustServerCertificate=True;"

      RabbitMQ__Hostname: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: admin
      RabbitMQ__Password: admin
      RabbitMQ__VirtualHost: "/"
    ports:
      - "8081:8080"
    networks:
      - microservicios-net


  # =====================================================
  # Kong API Gateway
  # =====================================================
  kong:
    image: kong:3.9
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - microservicios-net


# =====================================================
# VOLUMES
# =====================================================
volumes:

  postgres-ventas-data:
    external: true
    name: appmicroventasapi_postgres-ventas-data

  mysql-productos-data:
    external: true
    name: microproductos-api_mysql_productos_data

  rabbitmq-data:

  sql-clientes-data:
    external: true
    name: microclientesapi_sql_clientes_data




# =====================================================
# RED CENTRAL
# =====================================================
networks:
  microservicios-net:
    external: true
    name: microclientesapi_net-app-distribuidas