_format_version: "3.0"
_transform: true

services:

  - name: microclientes-service
    url: http://microclientes:8080/api/cliente

    plugins:
      - name: cors
        config:
          origins:
            - http://127.0.0.1:5500
            - http://localhost:5500
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
          credentials: false

    routes:
      - name: microclientes-route
        paths:
          - /clientes
        strip_path: true

