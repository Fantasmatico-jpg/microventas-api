services:

  service-mysql:
    image: mysql:8.0
    container_name: database-mysql-productos
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: MicroProductosDB
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin

    ports:
      - "3307:3306"

    volumes:
      - mysql_productos_data:/var/lib/mysql

    networks:
      - net-app-distribuidas

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uadmin",
          "-padmin"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  microproductos-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: microproductos-api:1.0
    container_name: microproductos-api
    restart: unless-stopped

    environment:
      DATABASE_URL: "mysql+pymysql://admin:admin@service-mysql:3306/MicroProductosDB"

    ports:
      - "8002:8000"

    depends_on:
      service-mysql:
        condition: service_healthy

    networks:
      - net-app-distribuidas

  kong:
    image: kong:3.9
    container_name: kong-gateway
    restart: unless-stopped

    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001

    ports:
      - "8000:8000"
      - "8001:8001"

    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro

    networks:
      - net-app-distribuidas

    depends_on:
      - microproductos-api

networks:
  net-app-distribuidas:
    driver: bridge


volumes:
  mysql_productos_data:

